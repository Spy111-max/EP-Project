<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Tree Planting Advisor 🌳</title>

  <!-- Leaflet CSS (vendored) -->
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <!-- Leaflet CSS (CDN fallback) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ── Sidebar ────────────────────────────────────────────────────────────── -->
<aside id="sidebar">
  <header class="sidebar-header">
    <span class="logo">🌳</span>
    <h1>Urban Tree<br>Planting Advisor</h1>
  </header>

  <!-- Controls -->
  <section class="panel" id="controls-panel">
    <h2>Search & Filters</h2>

    <label for="city-input">City / Location</label>
    <input
      id="city-input"
      type="text"
      placeholder="e.g. Mumbai, Delhi, Bangalore…"
      autocomplete="off"
    />
    <datalist id="city-suggestions"></datalist>

    <label for="radius-input">Search Radius</label>
    <div class="range-row">
      <input id="radius-input" type="range" min="500" max="20000" step="500" value="5000" />
      <span id="radius-label">5 km</span>
    </div>

    <label for="tree-select">Tree Species</label>
    <select id="tree-select">
      <option value="any">Any species</option>
      <option value="neem">Neem (Azadirachta indica)</option>
      <option value="banyan">Banyan (Ficus benghalensis)</option>
      <option value="mango">Mango (Mangifera indica)</option>
    </select>

    <button id="analyse-btn" class="btn-primary">
      🔍 Analyse Land
    </button>
  </section>

  <!-- Layer toggles -->
  <section class="panel" id="layers-panel">
    <h2>Map Layers</h2>
    <label class="toggle-row">
      <input type="checkbox" id="toggle-satellite" checked />
      <span class="toggle-label">🛰️ Satellite imagery</span>
    </label>
    <label class="toggle-row">
      <input type="checkbox" id="toggle-ndvi" checked />
      <span class="toggle-label">🌿 NDVI overlay</span>
    </label>
    <label class="toggle-row">
      <input type="checkbox" id="toggle-landcover" />
      <span class="toggle-label">🏙️ Land cover</span>
    </label>
    <label class="toggle-row">
      <input type="checkbox" id="toggle-greenspaces" checked />
      <span class="toggle-label">🌳 Greenspace zones</span>
    </label>
    <label class="toggle-row">
      <input type="checkbox" id="toggle-heatmap" checked />
      <span class="toggle-label">🔥 Suitability heatmap</span>
    </label>

    <div class="opacity-row">
      <label for="overlay-opacity">Overlay opacity</label>
      <input type="range" id="overlay-opacity" min="0" max="1" step="0.05" value="0.7" />
    </div>
  </section>

  <!-- Stats -->
  <section class="panel" id="stats-panel" hidden>
    <h2>Analysis Results</h2>
    <div id="stats-content"></div>
  </section>

  <!-- Zone list -->
  <section class="panel" id="zones-panel" hidden>
    <h2>Top Candidate Zones</h2>
    <ul id="zones-list"></ul>
  </section>
</aside>

<!-- ── Map ────────────────────────────────────────────────────────────────── -->
<main id="map-container">
  <div id="map"></div>
  <div id="spinner" hidden>
    <div class="spinner-inner"></div>
    <p>Analysing satellite data…</p>
  </div>
  <div id="toast"></div>
</main>

<!-- Leaflet JS (vendored) -->
<script src="vendor/leaflet.js"></script>
<!-- Leaflet CDN fallback -->
<script>if (!window.L) document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>

<!-- App JS (module order matters) -->
<script src="js/satellite.js"></script>
<script src="js/landAnalysis.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
